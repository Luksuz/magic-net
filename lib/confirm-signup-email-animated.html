<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Signup</title>
    <style type="text/css">
        /* Keyframe animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Responsive adjustments */
        @media screen and (max-width: 600px) {
            .container {
                width: 100% !important;
                padding: 15px !important;
            }
            .button {
                width: 100% !important;
                padding: 12px 0 !important;
            }
            .main-card {
                padding: 20px !important;
            }
        }

        /* Button hover effect - limited support in emails */
        .button:hover {
            transform: scale(1.05); /* Will only work in some clients */
            background-color: #132d48 !important; /* Darken button on hover */
        }

    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f7f6; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <!-- Logo -->
                <img src="https://qfpjbgjxkpwtsegtkaze.supabase.co/storage/v1/object/public/images//logo.png" alt="Company Logo" width="70" style="display: block; margin-bottom: 20px; border-radius: 50%; animation: pulseLogo 2s infinite ease-in-out;">
                
                <table border="0" cellpadding="0" cellspacing="0" width="600" class="container main-card" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 40px; text-align: center; animation: fadeIn 1s ease-out forwards;">
                    <tr>
                        <td>
                            <h2 style="color: #1a3c5e; font-size: 24px; margin-top: 0; margin-bottom: 20px; font-weight: bold;">
                                Confirm your signup
                            </h2>
                            <p style="color: #555555; font-size: 16px; line-height: 1.6; margin-bottom: 30px;">
                                Please follow this link to confirm your user and activate your account:
                            </p>
                            <a href="https://magic-net-p2sx.vercel.app/login?email_confirmed=true" target="_blank" class="button" style="background-color: #1a3c5e; color: #ffffff; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-size: 16px; font-weight: bold; display: inline-block; transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out;">
                                Confirm Your Email
                            </a>
                            <p style="color: #777777; font-size: 14px; line-height: 1.6; margin-top: 30px;">
                                If you did not request this, please ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>

                <!-- Footer -->
                <table border="0" cellpadding="0" cellspacing="0" width="600" class="container" style="margin-top: 20px; text-align: center; animation: fadeIn 1s 0.5s ease-out forwards; opacity: 0;">
                    <tr>
                        <td style="padding: 10px 0;">
                            <p style="color: #888888; font-size: 12px;">
                                &copy; 2024 Magic Net. All rights reserved.<br>
                                Koprivnička 17 C, HR - 42230 Ludbreg
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
